name: v0.9 Atomic Override Smoke

on:
  push:
    branches: [v0.9-atomic-override]
    paths:
      - 'src/economic/**'
      - 'contracts/AtomicCycleExecutor.sol'
      - 'contracts/AtomicCycleExecutor.artifact.json'
      - 'scripts/v09-atomic-override-smoke.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/v09-atomic-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-state-override-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify live state-override executor path
        env:
          TRUTH_LAUNCH_LIMIT: 16
        run: node scripts/v09-atomic-override-smoke.mjs
