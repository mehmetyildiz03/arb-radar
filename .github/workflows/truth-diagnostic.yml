name: Truth Diagnostic

on:
  push:
    branches: [v0.8.2-truth-depth-audit]
    paths:
      - 'scripts/v081-truth-diagnostic.mjs'
      - '.github/workflows/truth-diagnostic.yml'
      - 'src/economic/**'
      - 'src/adapters/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Compare marginal truth with exact depth
        env:
          TRUTH_LAUNCH_LIMIT: 10
          TRUTH_DIAGNOSTIC_TOP: 8
          TRUTH_DIAGNOSTIC_SIZES: 0.01,0.03,0.10,0.30,1,3,10
        run: node scripts/v081-truth-diagnostic.mjs
