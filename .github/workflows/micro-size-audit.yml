name: Micro Size Audit

on:
  push:
    branches: [v0.8.1-micro-sizing-audit]
    paths:
      - 'scripts/v08-micro-size-sweep.mjs'
      - '.github/workflows/micro-size-audit.yml'
      - 'src/economic/**'
      - 'src/adapters/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Sweep exact closed-cycle sizes
        env:
          TRUTH_LAUNCH_LIMIT: 30
          SWEEP_SCANS: 8
          SWEEP_CANDIDATE_LIMIT: 6
          SWEEP_SIZES_USD: 0.01,0.03,0.1,0.3,1,3,10
          MIN_NET_PROFIT_USD: 0.05
        run: node scripts/v08-micro-size-sweep.mjs
